<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F1B2D" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="O2D Analytics" />
  <meta name="description" content="Order-to-Delivery Operations Dashboard for Fresko" />

  <title>O2D Analytics | Fresko</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />

  <!-- Chart.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <style>
    /* ═══════════════════════════════════════════════════════
       DESIGN TOKENS — Dark navy O2D theme
    ═══════════════════════════════════════════════════════ */
    :root {
      --bg-base:     #0F1B2D;
      --bg-card:     #152236;
      --bg-card2:    #1B2E4B;
      --bg-glass:    rgba(21,34,54,0.85);
      --border:      rgba(255,255,255,0.08);
      --accent:      #3B82F6;
      --accent2:     #06B6D4;
      --success:     #10B981;
      --warning:     #F59E0B;
      --danger:      #EF4444;
      --muted:       #94A3B8;
      --text:        #E2E8F0;
      --text-dim:    #64748B;
      --text-bright: #F8FAFC;

      /* Pipeline status colours */
      --s-pending:   #6366F1;
      --s-loaded:    #8B5CF6;
      --s-transit:   #F59E0B;
      --s-delivered: #10B981;
      --s-deo:       #3B82F6;
      --s-invoiced:  #06B6D4;

      --radius-sm:  8px;
      --radius-md:  12px;
      --radius-lg:  18px;
      --shadow-sm:  0 1px 4px rgba(0,0,0,0.4);
      --shadow-md:  0 4px 20px rgba(0,0,0,0.5);
      --shadow-lg:  0 8px 40px rgba(0,0,0,0.6);

      --top-bar-h:  56px;
      --tab-bar-h:  48px;
      --bottom-safe: env(safe-area-inset-bottom, 0px);
    }

    /* ── Reset ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      background: var(--bg-base);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      height: 100%;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── App Shell ─────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
    }

    /* ── Top App Bar ───────────────────────────────────────── */
    #top-bar {
      flex-shrink: 0;
      height: var(--top-bar-h);
      padding: 0 16px;
      padding-top: env(safe-area-inset-top, 0);
      background: var(--bg-card2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
      box-shadow: var(--shadow-md);
    }
    #top-bar .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    #top-bar .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 13px;
      color: #fff;
      flex-shrink: 0;
      letter-spacing: -.5px;
    }
    #top-bar h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-bright);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #top-bar .subtitle {
      font-size: 10px;
      color: var(--muted);
      line-height: 1;
    }
    #top-bar .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: background 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:active { background: var(--accent); border-color: var(--accent); }
    #refresh-btn.spinning { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Status pill in top-bar */
    #data-status {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
    }
    #data-status.loaded  { color: var(--success); }
    #data-status.loading { color: var(--warning); }
    #data-status.error   { color: var(--danger); }

    /* ── View Toolbar (horizontal scroll tabs) ─────────────── */
    #view-toolbar {
      flex-shrink: 0;
      height: var(--tab-bar-h);
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      gap: 2px;
      padding: 6px 8px;
    }
    #view-toolbar::-webkit-scrollbar { display: none; }

    .view-tab {
      flex-shrink: 0;
      height: 36px;
      padding: 0 14px;
      border: 1px solid transparent;
      background: transparent;
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .view-tab .tab-icon { font-size: 14px; }
    .view-tab:hover { color: var(--text); background: var(--bg-card2); }
    .view-tab.active {
      color: var(--accent);
      background: rgba(59,130,246,0.15);
      border-color: rgba(59,130,246,0.3);
    }

    /* ── View Container ────────────────────────────────────── */
    #view-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px;
      padding-bottom: calc(16px + var(--bottom-safe));
      -webkit-overflow-scrolling: touch;
    }

    /* ── Loading Overlay ───────────────────────────────────── */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,27,45,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 9000;
      transition: opacity 0.3s;
    }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loader-ring {
      width: 48px; height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #loading-overlay p { color: var(--muted); font-size: 13px; }

    /* ── Toast ─────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: calc(24px + var(--bottom-safe));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-card2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 18px;
      font-size: 13px;
      color: var(--text);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 8000;
      white-space: nowrap;
      box-shadow: var(--shadow-lg);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.err  { border-color: var(--danger); color: var(--danger); }
    #toast.ok   { border-color: var(--success); color: var(--success); }

    /* ── Modal / Bottom Sheet ──────────────────────────────── */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 7000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    #modal-overlay.open { opacity: 1; pointer-events: all; }

    #modal-sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      max-height: 90dvh;
      background: var(--bg-card);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      border-top: 1px solid var(--border);
      z-index: 7100;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #modal-sheet.open { transform: translateY(0); }

    .modal-handle {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      padding: 10px 0 4px;
    }
    .modal-handle::before {
      content: '';
      width: 40px; height: 4px;
      background: var(--border);
      border-radius: 2px;
    }

    .modal-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px 12px;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-bright);
    }
    .modal-close {
      width: 28px; height: 28px;
      background: var(--bg-card2);
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      -webkit-tap-highlight-color: transparent;
    }

    #modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      -webkit-overflow-scrolling: touch;
    }

    /* ═══════════════════════════════════════════════════════
       COMMON COMPONENTS
    ═══════════════════════════════════════════════════════ */

    /* KPI Cards Row */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .kpi-card .kpi-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
    }
    .kpi-card .kpi-value {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-bright);
      line-height: 1;
    }
    .kpi-card .kpi-sub {
      font-size: 10px;
      color: var(--text-dim);
    }
    .kpi-card.accent1 { border-color: rgba(59,130,246,0.3); }
    .kpi-card.accent2 { border-color: rgba(16,185,129,0.3); }
    .kpi-card.accent3 { border-color: rgba(245,158,11,0.3); }
    .kpi-card.accent4 { border-color: rgba(239,68,68,0.3); }

    /* Section heading */
    .section-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .section-head h2 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
    }
    .section-head .badge {
      background: var(--bg-card2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 10px;
      color: var(--text-dim);
    }

    /* Status pill */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }
    .status-pill::before {
      content: '';
      width: 5px; height: 5px;
      border-radius: 50%;
      background: currentColor;
    }
    .status-pill.pending    { color: var(--s-pending);   background: rgba(99,102,241,.15); }
    .status-pill.wh-loaded  { color: var(--s-loaded);    background: rgba(139,92,246,.15); }
    .status-pill.in-transit { color: var(--s-transit);   background: rgba(245,158,11,.15); }
    .status-pill.delivered  { color: var(--s-delivered); background: rgba(16,185,129,.15); }
    .status-pill.deo        { color: var(--s-deo);       background: rgba(59,130,246,.15); }
    .status-pill.invoiced   { color: var(--s-invoiced);  background: rgba(6,182,212,.15);  }

    /* Search + filter bar */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .filter-bar input,
    .filter-bar select {
      flex: 1;
      min-width: 130px;
      height: 36px;
      padding: 0 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    .filter-bar input:focus,
    .filter-bar select:focus { border-color: var(--accent); }
    .filter-bar input::placeholder { color: var(--text-dim); }

    /* Action button */
    .btn {
      height: 36px;
      padding: 0 16px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-sm { height: 28px; padding: 0 10px; font-size: 11px; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-dim);
    }
    .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state p { font-size: 13px; }

    /* ═══════════════════════════════════════════════════════
       VIEW: KANBAN
    ═══════════════════════════════════════════════════════ */
    #view-kanban {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      min-height: calc(100vh - var(--top-bar-h) - var(--tab-bar-h) - 100px);
      align-items: flex-start;
    }
    .kanban-col {
      flex-shrink: 0;
      width: 240px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .kanban-col-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .kanban-col-header .col-count {
      margin-left: auto;
      background: var(--bg-card2);
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 10px;
      color: var(--text-dim);
    }
    .kanban-col-body {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: calc(100vh - var(--top-bar-h) - var(--tab-bar-h) - 120px);
      overflow-y: auto;
    }
    .kanban-card {
      background: var(--bg-card2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .kanban-card:active { box-shadow: 0 0 0 2px var(--accent); }
    .kanban-card .kc-id {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      font-family: monospace;
    }
    .kanban-card .kc-customer {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-bright);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .kanban-card .kc-meta {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .kanban-card .kc-chip {
      font-size: 9px;
      color: var(--muted);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
    }

    /* ═══════════════════════════════════════════════════════
       VIEW: TABLE
    ═══════════════════════════════════════════════════════ */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    table thead tr {
      background: var(--bg-card2);
      border-bottom: 2px solid var(--border);
    }
    table th {
      padding: 10px 12px;
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    table th:hover { color: var(--text); }
    table th .sort-icon { margin-left: 4px; opacity: 0.4; }
    table th.sorted .sort-icon { opacity: 1; color: var(--accent); }
    table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
      cursor: pointer;
    }
    table tbody tr:hover { background: var(--bg-card2); }
    table tbody tr:last-child { border-bottom: none; }
    table td {
      padding: 10px 12px;
      color: var(--text);
      white-space: nowrap;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    table td.mono { font-family: monospace; font-size: 11px; color: var(--accent); }

    /* ═══════════════════════════════════════════════════════
       VIEW: CHART
    ═══════════════════════════════════════════════════════ */
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .chart-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
    }
    .chart-card h3 {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }
    .chart-card canvas { width: 100% !important; }

    /* ═══════════════════════════════════════════════════════
       VIEW: CALENDAR
    ═══════════════════════════════════════════════════════ */
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .cal-nav-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      width: 32px; height: 32px;
      cursor: pointer;
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .cal-title { font-weight: 700; font-size: 15px; color: var(--text-bright); }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .cal-day-name {
      text-align: center;
      font-size: 9px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      padding: 6px 0;
    }
    .cal-cell {
      min-height: 52px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .cal-cell:hover { border-color: var(--accent); }
    .cal-cell.empty { background: transparent; border-color: transparent; cursor: default; }
    .cal-cell.today { border-color: var(--accent); }
    .cal-cell .cal-day-num {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      line-height: 1;
    }
    .cal-cell.today .cal-day-num { color: var(--accent); }
    .cal-cell .cal-dots {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      margin-top: 4px;
    }
    .cal-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    .cal-dot.many { width: 100%; height: 12px; border-radius: 3px; font-size: 8px;
                    color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }

    /* ═══════════════════════════════════════════════════════
       VIEW: TIMELINE
    ═══════════════════════════════════════════════════════ */
    .timeline-order-select {
      margin-bottom: 16px;
    }
    .timeline-wrap {
      position: relative;
      padding-left: 28px;
    }
    .timeline-wrap::before {
      content: '';
      position: absolute;
      left: 10px; top: 0; bottom: 0;
      width: 2px;
      background: var(--border);
    }
    .timeline-step {
      position: relative;
      margin-bottom: 20px;
    }
    .timeline-dot {
      position: absolute;
      left: -22px; top: 4px;
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--bg-base);
      display: flex; align-items: center; justify-content: center;
      font-size: 7px;
      font-weight: 900;
    }
    .timeline-dot.done { border-color: var(--success); background: var(--success); color: #fff; }
    .timeline-dot.pending { border-color: var(--text-dim); }

    .timeline-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }
    .timeline-card.done { border-color: rgba(16,185,129,0.3); }
    .timeline-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-bright);
    }
    .timeline-times {
      display: flex;
      gap: 16px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .timeline-time-item {
      display: flex;
      flex-direction: column;
    }
    .timeline-time-item .tt-label {
      font-size: 9px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.5px;
    }
    .timeline-time-item .tt-val {
      font-size: 11px;
      font-family: monospace;
      color: var(--text);
    }
    .timeline-time-item .tt-val.late { color: var(--danger); }
    .timeline-delta {
      margin-top: 6px;
      font-size: 10px;
      color: var(--muted);
    }
    .timeline-delta.on-time { color: var(--success); }
    .timeline-delta.late    { color: var(--danger);  }

    /* ═══════════════════════════════════════════════════════
       VIEW: LIST
    ═══════════════════════════════════════════════════════ */
    .list-feed {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .list-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      transition: border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .list-card:active { border-color: var(--accent); }
    .list-card-left {
      flex: 1;
      min-width: 0;
    }
    .list-card-id {
      font-size: 10px;
      font-weight: 700;
      font-family: monospace;
      color: var(--accent);
    }
    .list-card-customer {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-bright);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .list-card-meta {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .list-card-meta span {
      font-size: 10px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .list-card-right {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .list-card-date {
      font-size: 10px;
      color: var(--muted);
      font-family: monospace;
    }

    /* ═══════════════════════════════════════════════════════
       VIEW: GALLERY
    ═══════════════════════════════════════════════════════ */
    .gallery-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .gallery-tab-btn {
      flex: 1;
      height: 32px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .gallery-tab-btn.active {
      background: rgba(59,130,246,0.15);
      border-color: var(--accent);
      color: var(--accent);
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
    }
    .gallery-item {
      aspect-ratio: 1;
      background: var(--bg-card2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }
    .gallery-item img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.2s;
    }
    .gallery-item:active img { transform: scale(1.05); }
    .gallery-item .gallery-label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 4px 6px;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      font-size: 8px;
      font-family: monospace;
      color: rgba(255,255,255,0.8);
    }
    .gallery-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      gap: 4px;
      color: var(--text-dim);
      font-size: 10px;
    }
    .gallery-placeholder .ph-icon { font-size: 24px; }

    /* ═══════════════════════════════════════════════════════
       VIEW: DETAIL (modal content)
    ═══════════════════════════════════════════════════════ */
    .detail-section {
      margin-bottom: 20px;
    }
    .detail-section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .detail-section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .detail-kv-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .detail-kv {
      background: var(--bg-card2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
    }
    .detail-kv .dk-label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-dim);
    }
    .detail-kv .dk-val {
      font-size: 13px;
      color: var(--text-bright);
      margin-top: 2px;
      font-weight: 500;
    }
    .detail-kv .dk-val.mono { font-family: monospace; color: var(--accent); font-size: 12px; }

    .detail-items-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .detail-items-table th {
      padding: 6px 8px;
      text-align: left;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
    }
    .detail-items-table td {
      padding: 8px 8px;
      color: var(--text);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .detail-photos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .detail-photo-box {
      aspect-ratio: 4/3;
      background: var(--bg-card2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 6px;
      color: var(--text-dim);
      font-size: 10px;
    }
    .detail-photo-box img { width: 100%; height: 100%; object-fit: cover; }

    /* ═══════════════════════════════════════════════════════
       VIEW: PIVOT
    ═══════════════════════════════════════════════════════ */
    .pivot-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .pivot-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }
    .pivot-table {
      border-collapse: collapse;
      font-size: 11px;
      white-space: nowrap;
    }
    .pivot-table th, .pivot-table td {
      padding: 8px 12px;
      border: 1px solid var(--border);
    }
    .pivot-table thead th {
      background: var(--bg-card2);
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
    }
    .pivot-table tbody tr:hover { background: var(--bg-card2); }
    .pivot-table .pivot-row-head {
      background: var(--bg-card);
      font-weight: 700;
      color: var(--text);
    }
    .pivot-table .pivot-total {
      background: rgba(59,130,246,0.1);
      font-weight: 700;
      color: var(--accent);
    }

    /* ═══════════════════════════════════════════════════════
       VIEW: MAP
    ═══════════════════════════════════════════════════════ */
    .map-note {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .location-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }
    .location-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .location-card:hover { border-color: var(--accent); }
    .location-card .loc-icon { font-size: 24px; margin-bottom: 8px; }
    .location-card .loc-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 4px;
    }
    .location-card .loc-count {
      font-size: 11px;
      color: var(--muted);
    }

    /* ═══════════════════════════════════════════════════════
       VIEW: TREE
    ═══════════════════════════════════════════════════════ */
    .tree-root {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tree-node {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .tree-node-header {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tree-node-header:hover { background: var(--bg-card2); }
    .tree-chevron {
      font-size: 10px;
      color: var(--text-dim);
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .tree-node.open .tree-chevron { transform: rotate(90deg); }
    .tree-node-label {
      flex: 1;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-bright);
    }
    .tree-node-count {
      font-size: 11px;
      color: var(--muted);
      background: var(--bg-card2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2px 8px;
    }
    .tree-node-children {
      display: none;
      border-top: 1px solid var(--border);
      padding: 8px;
    }
    .tree-node.open .tree-node-children { display: block; }

    .tree-order-node {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      overflow: hidden;
    }
    .tree-order-header {
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      background: var(--bg-card2);
      -webkit-tap-highlight-color: transparent;
    }
    .tree-order-header:hover { background: rgba(59,130,246,0.08); }
    .tree-order-id { font-family: monospace; font-size: 11px; color: var(--accent); }
    .tree-order-meta { font-size: 11px; color: var(--muted); margin-left: auto; }
    .tree-order-items {
      display: none;
      padding: 8px 10px;
      border-top: 1px solid var(--border);
    }
    .tree-order-node.open .tree-order-items { display: block; }
    .tree-order-node.open .tree-chevron { transform: rotate(90deg); }
    .tree-item-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 11px;
    }
    .tree-item-row:last-child { border-bottom: none; }
    .tree-item-name { color: var(--text); }
    .tree-item-qty  { color: var(--accent); font-family: monospace; font-weight: 700; }

    /* ═══════════════════════════════════════════════════════
       RESPONSIVE OVERRIDES
    ═══════════════════════════════════════════════════════ */
    @media (min-width: 600px) {
      .kpi-row { grid-template-columns: repeat(4, 1fr); }
      .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
      #modal-sheet { max-width: 560px; left: 50%; transform: translateX(-50%) translateY(100%); border-radius: var(--radius-lg); }
      #modal-sheet.open { transform: translateX(-50%) translateY(0); }
    }

    @media (min-width: 900px) {
      .chart-grid { grid-template-columns: repeat(3, 1fr); }
      .kanban-col { width: 280px; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Top App Bar ─────────────────────────────────────── -->
  <header id="top-bar">
    <div class="brand">
      <div class="logo">O2D</div>
      <div>
        <h1>O2D Analytics</h1>
        <div class="subtitle">Fresko Operations</div>
      </div>
    </div>
    <div class="actions">
      <span id="data-status" class="loading">Loading…</span>
      <button class="icon-btn" id="refresh-btn" title="Refresh data" aria-label="Refresh">
        ↻
      </button>
      <button class="icon-btn" id="export-btn" title="Export CSV" aria-label="Export">
        ⬇
      </button>
    </div>
  </header>

  <!-- ── View Switcher Toolbar ───────────────────────────── -->
  <nav id="view-toolbar" role="tablist" aria-label="View modes">
    <button class="view-tab active" data-view="kanban"   role="tab"><span class="tab-icon">🗂</span>Kanban</button>
    <button class="view-tab"        data-view="table"    role="tab"><span class="tab-icon">📋</span>Table</button>
    <button class="view-tab"        data-view="chart"    role="tab"><span class="tab-icon">📊</span>Charts</button>
    <button class="view-tab"        data-view="calendar" role="tab"><span class="tab-icon">📅</span>Calendar</button>
    <button class="view-tab"        data-view="timeline" role="tab"><span class="tab-icon">⏱</span>Timeline</button>
    <button class="view-tab"        data-view="list"     role="tab"><span class="tab-icon">📝</span>List</button>
    <button class="view-tab"        data-view="gallery"  role="tab"><span class="tab-icon">🖼</span>Gallery</button>
    <button class="view-tab"        data-view="pivot"    role="tab"><span class="tab-icon">🔢</span>Pivot</button>
    <button class="view-tab"        data-view="map"      role="tab"><span class="tab-icon">📍</span>Map</button>
    <button class="view-tab"        data-view="tree"     role="tab"><span class="tab-icon">🌳</span>Tree</button>
    <button class="view-tab"        data-view="purchase" role="tab"><span class="tab-icon">🛒</span>Purchase</button>
  </nav>

  <!-- ── Main View Container ────────────────────────────── -->
  <main id="view-container" role="main"></main>

</div><!-- #app -->

<!-- ── Loading Overlay ──────────────────────────────────── -->
<div id="loading-overlay" role="status" aria-live="polite">
  <div class="loader-ring"></div>
  <p id="loading-msg">Connecting to Fresko O2D…</p>
</div>

<!-- ── Toast ────────────────────────────────────────────── -->
<div id="toast" role="alert" aria-live="assertive"></div>

<!-- ── Modal Bottom Sheet (Detail View) ─────────────────── -->
<div id="modal-overlay"></div>
<div id="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-handle"></div>
  <div class="modal-header">
    <h3 id="modal-title">Order Detail</h3>
    <button class="modal-close" id="modal-close-btn" aria-label="Close">✕</button>
  </div>
  <div id="modal-body"></div>
</div>

<!-- ── Service Worker Registration ──────────────────────── -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js', { scope: './' })
      .catch(function(e) { console.warn('SW register failed:', e); });
  });
}
</script>

<!-- ── API Config (set GAS_URL here) ────────────────────── -->
<script src="apiconfig.js"></script>

<!-- ── Main App Script ───────────────────────────────────── -->
<script src="app.js"></script>

</body>
</html>
